name: CRI-CORE validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cri-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies and candidate
        run: |
          python -m pip install --index-url https://pypi.org/simple -r tools/ci-requirements.txt
          python -m pip install --no-build-isolation --editable '.[dev]'
          python -m pip check
      - name: Run complete active suite and compilation
        run: |
          python -m pytest -q
          python -m compileall -q src tests tools
      - name: Build wheel and sdist, then check metadata
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Check inventories and clean-wheel behavior
        run: python tools/check_distribution.py --dist-dir dist
      - name: Check out the coordinated Guard compatibility target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Waveframe-Labs/Waveframe-Guard
          ref: 2c4a77f89bb234fbde32937435535cffec4dc905
          path: .guard-compatibility
          persist-credentials: false
      - name: Install candidate wheel and exact Guard in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/guard-venv"
          guard_python="$RUNNER_TEMP/guard-venv/bin/python"
          "$guard_python" -m pip install --index-url https://pypi.org/simple -r tools/ci-requirements.txt
          ledger_version="0.8.0"
          if [[ '${{ matrix.python }}' == '3.10' ]]; then ledger_version="0.7.0"; fi
          "$guard_python" -m pip install --no-build-isolation --editable '.guard-compatibility[test]' dist/*.whl "governance-ledger==$ledger_version"
          "$guard_python" -m pip check
      - name: Verify complete applicable Guard suite and legacy rejection
        working-directory: .guard-compatibility
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '2c4a77f89bb234fbde32937435535cffec4dc905'
          "$RUNNER_TEMP/guard-venv/bin/python" -m pytest -q -rs
          "$RUNNER_TEMP/guard-venv/bin/python" -m tools.security.reproduce_issue39
          git diff --exit-code
